# Vornik Community Edition — public CI (artifact-purity gates).
# Injected into the public repo at export time by scripts/export-public-ce.sh.
#
# Actions are pinned to commit SHAs (supply-chain hygiene); the trailing
# comment records the human-readable version — bump both together.
# Jobs: build-test (unit) · integration (Postgres) · artifact-purity (no-EE /
# docs-drift / no-trading) · release (on a v* tag: build + CycloneDX SBOM +
# SLSA build-provenance & SBOM attestations + GitHub release).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go build ./...
      - run: go vet ./...
      # Unit tests. Integration (`//go:build integration`) and e2e
      # (`//go:build e2e`) suites are excluded by build tag — they run in the
      # integration job below. This also runs the artifact-purity gates in
      # internal/architecture (TestNoEnterpriseInTree, TestCommunityMainIsEEFree)
      # and the editions matrix failsafe (internal/editions
      # TestCrossCheck_CleanOnRealRegistry).
      - run: go test ./...

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector-bundled Postgres: the memory subsystem declares vector()
        # columns, so the vanilla postgres image fails at that migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vornik
          POSTGRES_PASSWORD: vornik
          POSTGRES_DB: vornik_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Apply base schema
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: vornik
          PGPASSWORD: vornik
          PGDATABASE: vornik_integration_test
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client || true
          psql -f deployments/postgres/schema/001_initial.sql || echo "base schema skipped; suites run migrations"
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://vornik:vornik@localhost:5432/vornik_integration_test?sslmode=disable
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: vornik
          POSTGRES_PASSWORD: vornik
          POSTGRES_DB: vornik_integration_test
          # ./internal/memory/... skips cleanly without a reachable database.
          # In a lane that would turn the Art 17 erasure guarantees into
          # SKIPs, which read as passes; this makes them failures instead.
          VORNIK_REQUIRE_INTEGRATION_DB: "1"
        # -p 1: these packages are separate test binaries that Go would run in
        # PARALLEL by default, all against the one shared Postgres DB. Some
        # integration tests do global-scope (no project filter) leases/locks
        # (e.g. lease_priority), so concurrent binaries intermittently steal or
        # lock another test's task -> "no tasks available". Serialise the
        # binaries so each owns the DB for its run; tests are deterministic in
        # isolation. (Within a package, tests already run sequentially.)
        run: go test -p 1 -tags=integration -count=1 ./test/integration/... ./internal/persistence/postgres/... ./internal/cli/... ./internal/memory/...

  artifact-purity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: No Enterprise source or imports in the tree
        run: |
          # Structural: the Enterprise IP directory must not exist.
          if [ -e internal/enterprise ]; then
            echo "FAIL: internal/enterprise present in the Community repo"; exit 1
          fi
          # Imports only (a quoted import path after leading whitespace) — not
          # the many legitimate comments that mention internal/enterprise. The
          # Go import-law test (internal/architecture) is the authoritative
          # transitive check; this is a fast structural backstop.
          if grep -rnE '^[[:space:]]*"[^"]*(internal/enterprise|vornik\.io/vornik/enterprise)' --include='*.go' . ; then
            echo "FAIL: Enterprise package imported in Community source"; exit 1
          fi
      - name: Public docs are generated + drift-free (incl. the CE/EE matrix)
        run: |
          go run ./cmd/docs-gen all
          git diff --exit-code -- docs/public || {
            echo "FAIL: docs/public is stale — run 'make docs-gen'"; exit 1; }
      - name: The console stylesheet is generated + drift-free
        run: make ui-css-check
      - name: Public docs carry no trading references
        run: |
          if grep -rIn -i 'trading' docs/public ; then
            echo "FAIL: trading domain is hidden from the public docs"; exit 1
          fi

  # The packages `vornikctl agent` depends on, run natively on a Mac on every
  # push, so a darwin regression shows at export time, not at tag time
  # (packaging design, amendment 2026-10-02). macOS runners cost nothing on a
  # public repository. The binary release that used to sit here ran only on
  # v* tags, and CE releases are calendar tags, so it never ran; it lives in
  # publish-release.yml now.
  macos-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      # Build AND run it: an execution failure must show on the export push,
      # not first at a release tag (packaging design, "As shipped, 2026.10.2").
      # vornikctl version prints to stderr, so both streams are captured.
      - name: Build and run vornikctl
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/vornikctl" ./cmd/vornikctl
          out="$("$RUNNER_TEMP/vornikctl" version 2>&1)"
          printf '%s\n' "$out"
          case "$out" in
            *"vornikctl version"*) ;;
            *) echo "::error::vornikctl version printed no version line"; exit 1 ;;
          esac
          "$RUNNER_TEMP/vornikctl" agent connect --help >/dev/null
      # go test passes on a package with no tests and on a -run that matches
      # none; a floor on the PASS count keeps this check from going vacuous
      # (review 20261002-0013 F4).
      - name: The agent packages' tests, natively
        run: |
          set -euo pipefail
          out="$(go test -v ./internal/agentbridge/... ./internal/harnessconfig/... 2>&1)" || { echo "$out"; exit 1; }
          n="$(grep -c -- '--- PASS' <<<"$out" || true)"
          echo "agentbridge + harnessconfig: $n tests passed"
          [ "$n" -ge 10 ] || { echo "::error::only $n tests ran; expected at least 10"; exit 1; }
          out="$(go test -v ./internal/cli/ -run 'Agent|Connect|Bridge|Harness' 2>&1)" || { echo "$out"; exit 1; }
          n="$(grep -c -- '--- PASS' <<<"$out" || true)"
          echo "cli agent tests: $n passed"
          [ "$n" -ge 10 ] || { echo "::error::only $n cli agent tests ran; expected at least 10"; exit 1; }
