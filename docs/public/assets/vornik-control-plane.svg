<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img"
     aria-label="Models propose, the daemon decides. Inside: the non-deterministic layer, where models plan, write code and text, and choose among the tools they are allowed. Around it: the deterministic layer, where the Vornik daemon decides which tools a role may call, what a task may spend, whether an output matches its schema, which actions need a person's approval on a paired phone, which network a container gets, which secrets are redacted, and what is recorded in the audit.">
  <title>Models propose. The daemon decides.</title>
  <desc>Vornik keeps model output inside a deterministic control plane: everything a model proposes passes the daemon's checks before it takes effect.</desc>

  <!-- Card background: an explicit light ground, as the benchmark charts use,
       so the figure reads the same on light and dark themes. -->
  <rect width="860" height="470" rx="10" fill="#F6F4EF"/>

  <g font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
    <text x="32" y="40" font-size="20" font-weight="600" fill="#101826">Models propose. The daemon decides.</text>
    <text x="32" y="62" font-size="13" fill="#5E6672">Everything a model proposes passes deterministic checks before it takes effect.</text>

    <!-- The deterministic layer: the outer frame -->
    <rect x="32" y="84" width="796" height="352" rx="14" fill="#FFFFFF" stroke="#101826" stroke-width="2"/>
    <text x="52" y="112" font-size="14" font-weight="600" fill="#101826">Deterministic layer — the Vornik daemon</text>
    <text x="52" y="131" font-size="12" fill="#5E6672">Same input, same decision. Written in code, not left to a model.</text>

    <!-- The non-deterministic layer: the inner core -->
    <rect x="320" y="182" width="220" height="150" rx="12" fill="#1C7ED6" fill-opacity="0.10" stroke="#1C7ED6" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="430" y="210" font-size="14" font-weight="600" fill="#1C7ED6" text-anchor="middle">Non-deterministic layer</text>
    <text x="430" y="229" font-size="12" fill="#5E6672" text-anchor="middle">the models, in sandboxed containers</text>
    <g font-size="13" fill="#101826" text-anchor="middle">
      <text x="430" y="262">plan the work</text>
      <text x="430" y="284">write code and text</text>
      <text x="430" y="306">choose among allowed tools</text>
    </g>

    <!-- The controls around the core: left column -->
    <g font-size="13" fill="#101826">
      <circle cx="62" cy="168" r="4" fill="#1C7ED6"/>
      <text x="74" y="172" font-weight="600">Tool grants</text>
      <text x="74" y="189" font-size="11.5" fill="#5E6672">a role calls only its allowed tools</text>

      <circle cx="62" cy="224" r="4" fill="#1C7ED6"/>
      <text x="74" y="228" font-weight="600">Budgets</text>
      <text x="74" y="245" font-size="11.5" fill="#5E6672">spend is capped per task and project</text>

      <circle cx="62" cy="280" r="4" fill="#1C7ED6"/>
      <text x="74" y="284" font-weight="600">Output schemas</text>
      <text x="74" y="301" font-size="11.5" fill="#5E6672">a step counts only if it matches</text>

      <circle cx="62" cy="336" r="4" fill="#1C7ED6"/>
      <text x="74" y="340" font-weight="600">Approvals</text>
      <text x="74" y="357" font-size="11.5" fill="#5E6672">sensitive actions wait for your phone</text>
    </g>

    <!-- right column -->
    <g font-size="13" fill="#101826">
      <circle cx="586" cy="168" r="4" fill="#1C7ED6"/>
      <text x="598" y="172" font-weight="600">Network per role</text>
      <text x="598" y="189" font-size="11.5" fill="#5E6672">no network unless the role opts in</text>

      <circle cx="586" cy="224" r="4" fill="#1C7ED6"/>
      <text x="598" y="228" font-weight="600">Credentials</text>
      <text x="598" y="245" font-size="11.5" fill="#5E6672">held by the daemon, not the model</text>

      <circle cx="586" cy="280" r="4" fill="#1C7ED6"/>
      <text x="598" y="284" font-weight="600">Redaction</text>
      <text x="598" y="301" font-size="11.5" fill="#5E6672">secrets scrubbed at every boundary</text>

      <circle cx="586" cy="336" r="4" fill="#1C7ED6"/>
      <text x="598" y="340" font-weight="600">Audit</text>
      <text x="598" y="357" font-size="11.5" fill="#5E6672">every decision is recorded</text>
    </g>

    <!-- The flow: a proposal leaves the core only through the checks -->
    <g stroke="#101826" stroke-width="1.5" fill="none">
      <path d="M430 332 L430 392"/>
      <path d="M424 384 L430 394 L436 384"/>
    </g>
    <text x="430" y="414" font-size="12.5" fill="#101826" text-anchor="middle" font-weight="600">checked, then it takes effect</text>

    <circle cx="44" cy="452" r="4" fill="#6EA83B"/>
    <text x="54" y="456" font-size="11" fill="#5E6672">Details: Security model and Architecture pages.</text>
  </g>
</svg>
